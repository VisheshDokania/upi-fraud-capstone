name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 ruff==0.16.8 numpy==2.5.3 pandas==3.0.6
          scikit-learn==1.9.1 xgboost==3.4.1 fastapi==0.141.1
          httpx==0.28.1 pydantic==2.13.5
      - name: Lint
        run: ruff check
      - name: Test
        run: pytest -q
