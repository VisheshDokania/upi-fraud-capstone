[tool.ruff]
line-length = 100
target-version = "py312"
include = [
  "app/**/*.py",
  "dashboard/**/*.py",
  "scripts/common_eval.py",
  "scripts/03b_tabular_timesplit.py",
  "scripts/05b_graph_ablation_valsplit.py",
  "scripts/06b_export_nlp_models.py",
  "scripts/07b_explainability_new_winners.py",
  "scripts/08_fusion_elliptic.py",
  "scripts/09_make_report_assets.py",
  "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
